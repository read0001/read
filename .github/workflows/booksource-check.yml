name: Book source check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: booksource-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Require the signing key
        env:
          OPENREAD_SIGNING_KEY: ${{ secrets.SOURCES_SIGNING_KEY }}
        run: |
          if [ -z "$OPENREAD_SIGNING_KEY" ]; then
            echo "::error::Repository secret SOURCES_SIGNING_KEY is not set. The app only accepts a signed booksources.json, so publishing without it would freeze every phone's source list."
            exit 1
          fi

      - name: Probe sources
        env:
          OPENREAD_SIGNING_KEY: ${{ secrets.SOURCES_SIGNING_KEY }}
        run: >
          ./gradlew :checker:run --no-daemon --console=plain
          --args="$GITHUB_WORKSPACE/booksource-check/candidates.tsv $GITHUB_WORKSPACE/booksource-check/out --concurrency 16 --no-proxy"

      - name: Commit updated subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add booksource-check/out/booksources.json booksource-check/out/booksources.json.sig booksource-check/out/state.json
          if git diff --cached --quiet; then
            echo "No change in the published sources"
          else
            git commit -m "Update book sources"
            git push
          fi
